name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r dev-requirements.txt
      - name: Run tests
        run: python -m pytest -q tests

  playwright:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r dev-requirements.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Start Streamlit app in background
        run: |
          nohup python -m streamlit run app.py &> streamlit.log &
          for i in {1..120}; do
            if curl -sSf http://localhost:8501/ > /dev/null; then
              echo "Streamlit started"
              break
            fi
            echo "Waiting for Streamlit... ($i)"
            sleep 1
          done
      - name: Verify app started
        run: |
          if ! curl -sSf http://localhost:8501/ > /dev/null; then
            echo "Streamlit did not start in time" >&2
            cat streamlit.log || true
            exit 1
          fi
      - name: Run Playwright UI smoke test
        env:
          PLAYWRIGHT_HEADLESS: '1'
        run: python scripts/playwright_test.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: scripts/screenshots/
          if-no-files-found: ignore
