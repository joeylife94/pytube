name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
      - name: Run tests
        run: python -m pytest -q tests

  playwright:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start Streamlit app in background
        run: |
          nohup python -m streamlit run app.py --server.headless=true &> streamlit.log &
          for i in {1..120}; do
            if curl -sSf http://localhost:8501/_stcore/health > /dev/null; then
              echo "Streamlit started"
              break
            fi
            echo "Waiting for Streamlit... ($i)"
            sleep 1
          done
      - name: Verify app started
        run: |
          if ! curl -sSf http://localhost:8501/_stcore/health > /dev/null; then
            echo "Streamlit did not start in time" >&2
            cat streamlit.log || true
            exit 1
          fi
      - name: Run Playwright UI smoke test
        env:
          PLAYWRIGHT_HEADLESS: '1'
        run: python scripts/playwright_test.py
      - name: Show Streamlit log on failure
        if: failure()
        run: cat streamlit.log || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: scripts/screenshots/
          if-no-files-found: ignore
