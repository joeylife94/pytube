# Per-machine settings (user, download folder, bind address, token) go in .env;
# see .env.example. A home server setup is described in docs/SERVER.md.
#
# Ports are published on 127.0.0.1 only, so other devices on the network can't
# reach the app. The web UI has no login; to reach it from other devices use a
# VPN such as Tailscale (docs/SERVER.md) rather than opening the ports.
services:
  # Streamlit web UI
  web:
    build: .
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8501:8501"
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - PYTHONUNBUFFERED=1
      # Scheduled downloads and timestamps use this zone (containers default to UTC)
      - TZ=${TZ:-Asia/Seoul}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # REST API server (set API_TOKEN in your shell or a .env file to require a token)
  api:
    build: .
    command: ["python", "api_server.py", "--host", "0.0.0.0", "--port", "8000"]
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Seoul}
      - API_TOKEN=${API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
